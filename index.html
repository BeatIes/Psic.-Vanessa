<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psic. Vanessa Gutiérrez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="abbie png.png">
    <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
        :root {
            --primary: #576238;
            --secondary: #849554;
            --accent: #85a42e;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
   
    .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .project-card {
            transition: all 0.3s ease;
        }
        
        .project-card:hover {
            transform: scale(1.03);
        }
        
.floating { 
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header/Navbar -->
    <header class="sticky top-0 z-50 gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center overflow-hidden">
                    <img src="abbie png.png" alt="Logo" class="w-full h-full object-cover">
</div>
                    <h1 class="text-xl font-bold">Psic. Vanessa Gutiérrez</h1>
                </div>
                <nav class="hidden md:flex space-x-8">
                    <a href="#inicio" class="hover:text-accent transition">Inicio</a>
                    <a href="#sobre-mi" class="hover:text-accent transition">Sobre mí</a>
                    <a href="#habilidades" class="hover:text-accent transition">Enfoque</a>
                    <a href="#proyectos" class="hover:text-accent transition">Atención</a>
                    <a href="#contacto" class="hover:text-accent transition">Contacto</a>
                </nav>
                <button class="md:hidden text-2xl" id="menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
<div class="md:hidden hidden gradient-bg w-full absolute left-0 px-4 py-2 shadow-lg" id="mobile-menu">
            <a href="#inicio" class="block py-2 hover:text-accent">Inicio</a>
            <a href="#sobre-mi" class="block py-2 hover:text-accent">Sobre mí</a>
            <a href="#habilidades" class="block py-2 hover:text-accent">Enfoque</a>
            <a href="#proyectos" class="block py-2 hover:text-accent">Atención</a>
            <a href="#contacto" class="block py-2 hover:text-accent">Contacto</a>
        </div>
    </header>

    <!-- Hero Section -->
<section id="inicio" class="gradient-bg text-white py-20">
        <div class="container mx-auto px-4 flex flex-col md:flex-row items-center">
            <div class="md:w-1/2 mb-10 md:mb-0">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">Psic. Vanessa Gutiérrez</h1>
                <h2 class="text-2xl md:text-3xl font-semibold mb-6">Psic. Clínica • Tanatóloga</h2>
                <p class="text-lg mb-8 max-w-lg">Terapia breve sistemica. Centrada en soluciones</p>
                <div class="flex space-x-4">
                    <a href="#contacto" class="bg-secondary hover:bg-accent text-white px-6 py-3 rounded-full font-medium transition shadow-lg">Contáctame</a>
                    <a href="#proyectos" class="bg-accent hover:bg-gray-100 px-6 py-3 rounded-full font-medium transition shadow-lg">Ver Proyectos</a>
                </div>
